<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Placar Digital - Central do Adm</title>
  <link class="icon" href="https://i.ibb.co/8LqSRDLB/logo-sem-fundo.png" type="image/png">
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: sans-serif;
      background-color: #12364e; 
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      color: #12364e;
      overflow-y: auto; 
    }

    /* --- BARRA ÚNICA COM OS CONTROLES LADO A LADO --- */
    .barra-controles-unificada {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 12px 0 12px;
      margin-top: 14px;
      margin-bottom: 12px;
    }

    .btn-topo-discreto {
      background-color: transparent;
      color: #e1d8cd;
      border: 1px solid #e1d8cd;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s, color 0.2s;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-topo-discreto:hover {
      background-color: #e1d8cd;
      color: #12364e;
    }

    .btn-fixar-notif {
      border-color: #2196f3;
      color: #2196f3;
    }
    
    .btn-fixar-notif:hover {
      background-color: #2196f3;
      color: #fff;
    }

    .btn-fase {
      background-color: transparent;
      color: #e1d8cd;
      border: 1px solid #e1d8cd;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
    }

    .btn-fase:hover {
      background-color: #e1d8cd;
      color: #12364e;
    }

    .btn-fase:active {
      transform: scale(0.95);
    }

    .btn-fase.ativo {
      background-color: #2196f3;
      border-color: #2196f3;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(33, 150, 243, 0.5);
    }

    .seletor-tema-placar {
      background-color: #12364e;
      color: #e1d8cd;
      border: 1px solid #e1d8cd;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      outline: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .seletor-tema-placar option {
      background-color: #12364e;
      color: #e1d8cd;
    }

    .container-placar-global {
      width: 100%;
      max-width: 900px;
      padding: 0 12px 4px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* --- ESTRUTURA COM ALTURA DE 500PX --- */
    .estrutura-placar {
      display: flex;
      background-color: #ffffff; 
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 500px; 
      margin-top: 16px; 
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .estrutura-placar.tema-padrao {
      background: #ffffff !important;
    }

    .estrutura-placar.tema-semifinal {
      background: linear-gradient(135deg, #a3a8b0 0%, #e6e8eb 45%, #ffffff 50%, #e6e8eb 55%, #8a9099 100%) !important;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45), inset 0 0 15px rgba(255, 255, 255, 0.6) !important;
    }

    .estrutura-placar.tema-final {
      background: linear-gradient(135deg, #b88e28 0%, #f7d468 40%, #fff2a1 50%, #f7d468 60%, #946f1a 100%) !important;
      box-shadow: 0 8px 30px rgba(184, 142, 40, 0.45), inset 0 0 15px rgba(255, 242, 161, 0.5) !important;
    }

    .estrutura-placar::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background-color: #e1d8cd;
      transform: translateX(-50%);
      z-index: 2;
    }

    .overlay-fase {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(18, 54, 78, 0.88);
      z-index: 30;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      pointer-events: none;
    }

    .texto-piscando {
      font-size: clamp(140px, 28vw, 280px);
      font-weight: bold;
      color: #ffeb3b;
      text-transform: uppercase;
      letter-spacing: 3px;
      line-height: 0.92;
      text-shadow: 0 0 30px rgba(255, 235, 59, 0.8);
      animation: piscarTexto 1s infinite alternate;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
    }

    .linha-fase {
      display: block;
      text-align: center;
      width: 100%;
    }

    @keyframes piscarTexto {
      0% { opacity: 0.2; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    .container-relogio-isolado {
      position: absolute;
      top: 14px; 
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      pointer-events: none;
    }

    .relogio-brasilia {
      background-color: #12364e;
      color: #ffffff; 
      border: 1.5px solid #e1d8cd; 
      border-radius: 8px;
      padding: 0 14px; 
      font-size: 58px;
      font-weight: bold;
      letter-spacing: 1.6px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      white-space: nowrap;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 82px;
    }

    .container-centro-elementos {
      position: absolute;
      top: 52%; 
      left: 50%;
      transform: translate(-50%, -50%); 
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-inverter-lados {
      background-color: #12364e;
      color: #e1d8cd;
      border: 1.5px solid #e1d8cd;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s, background-color 0.2s;
      pointer-events: auto;
    }

    .btn-inverter-lados:active {
      transform: scale(0.90);
      background-color: #1d4f71;
    }

    .logo-central {
      width: 66px;
      height: 66px;
      object-fit: contain;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.2));
      pointer-events: none;
    }

    .btn-zerar-central {
      background-color: #12364e;
      color: #e1d8cd;
      border: 1.5px solid #e1d8cd;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s, background-color 0.2s;
      pointer-events: auto;
    }

    .btn-zerar-central:active {
      transform: scale(0.90);
      background-color: #1d4f71;
    }

    .container-apito-isolado {
      position: absolute;
      bottom: 28px; 
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn-apito {
      background-color: #12364e;
      color: #e1d8cd;
      border: 2px solid #e1d8cd;
      border-radius: 50%;
      width: 40px; 
      height: 40px;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s, background-color 0.2s;
      -webkit-touch-callout: none; 
      -webkit-user-select: none;   
      user-select: none;            
    }

    .btn-apito:active {
      transform: scale(0.90);
      background-color: #1d4f71;
    }

    .lado-placar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    .faixa-base-time {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 95px;
      background-color: transparent;
      transition: background-color 0.3s;
      z-index: 2;
      pointer-events: none;
    }

    .lado-placar:first-child .faixa-base-time {
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 0px;
    }

    .lado-placar:last-child .faixa-base-time {
      border-bottom-left-radius: 0px;
      border-bottom-right-radius: 20px;
    }

    .area-ponto {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      min-height: 100%;
      flex: 1;
      transition: background-color 0.1s;
      position: relative;
    }
    
    .area-ponto:active {
      background-color: #d9b246;
    }

    .seletor-cor-time {
      background: #f7f5f2;
      color: #12364e;
      border: 1px solid #12364e;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 14px;
      font-weight: bold;
      position: absolute;
      top: 36px; 
      cursor: pointer;
      outline: none;
      z-index: 11;
      transition: background-color 0.3s, color 0.3s;
      height: 28px; 
    }

    #cor-esquerda { left: 32px; }
    #cor-direita { right: 32px; }

    .op-amarelo { background-color: #ffeb3b !important; color: #000 !important; }
    .op-azul { background-color: #2196f3 !important; color: #fff !important; }
    .op-roxo { background-color: #9c27b0 !important; color: #fff !important; }
    .op-rosa { background-color: #e91e63 !important; color: #fff !important; }
    .op-padrao { background-color: #f7f5f2 !important; color: #12364e !important; }

    .numero-pontos {
      font-size: clamp(290px, 32vh, 340px);
      font-weight: bold;
      color: #12364e;
      margin: 0;
      line-height: 1;
    }

    .bola-volei-indicador {
      position: absolute;
      bottom: 28px; 
      font-size: 28px;
      line-height: 28px;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 4; 
      filter: drop-shadow(1px 1px 0 #12364e) 
              drop-shadow(-1px -1px 0 #12364e) 
              drop-shadow(1px -1px 0 #12364e) 
              drop-shadow(-1px 1px 0 #12364e) 
              drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      pointer-events: none;
    }

    .bola-volei-indicador.ativo { opacity: 1; }
    #bola-esquerda { left: 12px; }
    #bola-direita { right: 12px; }

    .controles-lado {
      position: absolute;
      bottom: 28px; 
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }

    .btn-menos-um {
      background-color: #f7f5f2;
      color: #12364e;
      border: 2px solid #12364e;
      border-radius: 10px;
      padding: 3px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }

    .btn-menos-um:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    @media (orientation: portrait) {
      .aviso-orientacao { display: flex; }
    }

    .aviso-orientacao {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #12364e;
      color: #e1d8cd;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .aviso-orientacao span {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .janela-tabela {
      display: none;
      width: 100%;
      max-width: 900px;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      margin: 12px 0 24px 0;
      overflow: hidden;
    }

    .janela-tabela-barra {
      background-color: #12364e;
      border-bottom: 1px solid #e1d8cd;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e1d8cd;
    }

    .janela-tabela-titulo {
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .janela-tabela-botoes {
      display: flex;
      gap: 12px;
    }

    .btn-janela {
      background: transparent;
      border: none;
      color: #e1d8cd;
      font-size: 14px;
      cursor: pointer;
      padding: 2px;
      transition: transform 0.1s;
    }

    .btn-janela:active { transform: scale(0.85); }

    .janela-tabela-conteudo {
      width: 100%;
      height: 70vh; 
      border: none;
      transition: height 0.2s ease-out;
    }

    .janela-tabela-conteudo.minimizado {
      height: 0px !important;
    }

    /* --- ESTILOS DO MODO CONTROLE COMPACTO VERTICAL (LOCAL) --- */
    .modo-controle-ativo .container-placar-global:has(#placar-main),
    .modo-controle-ativo .aviso-orientacao,
    .modo-controle-ativo a.btn-topo-discreto[href="dashboard.html"],
    .modo-controle-ativo button#btnFullscreen,
    .modo-controle-ativo select#seletorTema {
      display: none !important;
    }

    .painel-controle-vertical {
      display: none;
      width: 100%;
      max-width: 450px;
      margin: 20px auto 10px auto;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      overflow: hidden;
      flex-direction: column;
      position: relative;
    }

    .modo-controle-ativo .painel-controle-vertical {
      display: flex;
    }

    .corpo-painel-controle {
      display: flex;
      flex-direction: row;
      width: 100%;
      position: relative;
    }

    .coluna-controle-time {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
    }

    .linha-controle-seletor {
      width: 100%;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
    }

    .linha-controle-seletor select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #12364e;
      outline: none;
      cursor: pointer;
    }

    .linha-controle-pontos {
      font-size: 72px;
      font-weight: bold;
      color: #12364e;
      margin: 10px 0 20px 0;
      line-height: 1;
    }

    .linha-controle-botoes {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .btn-acao-mais, .btn-acao-menos {
      flex: 1;
      padding: 14px 0;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      border: 2px solid #12364e;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-acao-mais {
      background-color: #2196f3;
      color: #fff;
      border-color: #2196f3;
    }

    .btn-acao-mais:active {
      transform: scale(0.95);
      background-color: #1976d2;
    }

    .btn-acao-menos {
      background-color: #f7f5f2;
      color: #12364e;
    }

    .btn-acao-menos:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* Botão de resetar centralizado no modo controle */
    .btn-zerar-controle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #12364e;
      color: #e1d8cd;
      border: 1.5px solid #e1d8cd;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
      z-index: 10;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-zerar-controle:active {
      transform: translate(-50%, -50%) scale(0.90);
      background-color: #1d4f71;
    }
  </style>
</head>
<body>

  <div class="aviso-orientacao">
    <span>🔄📱</span>
    <h2>Por favor, vire o seu aparelho de lado.</h2>
    <p>O placar foi otimizado para o modo horizontal (paisagem).</p>
  </div>

  <!-- PAINEL DE CONTROLE VERTICAL (MODO CONTROLE LOCAL) -->
  <div class="container-placar-global">
    <div class="painel-controle-vertical" id="painelControleVertical">
      <div class="corpo-painel-controle">
        
        <!-- BOTÃO DE RESET CENTRAL NO MODO CONTROLE -->
        <button class="btn-zerar-controle" onclick="zerarPlacar()" title="Zerar Placar">🔄</button>

        <!-- TIME ESQUERDO -->
        <div class="coluna-controle-time" id="col-ctrl-esquerda">
          <div class="linha-controle-seletor">
            <select id="ctrl-cor-esquerda" onchange="mudarCorLocal('esquerda')">
              <option value="" class="op-padrao">Cor Esquerda</option>
              <option value="Amarelo" class="op-amarelo">Amarelo</option>
              <option value="Azul" class="op-azul">Azul</option>
              <option value="Roxo" class="op-roxo">Roxo</option>
              <option value="Rosa" class="op-rosa">Rosa</option>
            </select>
          </div>
          <div class="linha-controle-pontos" id="ctrl-pts-esquerda">0</div>
          <div class="linha-controle-botoes">
            <button class="btn-acao-mais" onclick="adicionarPonto('esquerda')">+1</button>
            <button class="btn-acao-menos" onclick="subtrairPonto('esquerda')">-1</button>
          </div>
        </div>

        <!-- TIME DIREITO -->
        <div class="coluna-controle-time" id="col-ctrl-direita">
          <div class="linha-controle-seletor">
            <select id="ctrl-cor-direita" onchange="mudarCorLocal('direita')">
              <option value="" class="op-padrao">Cor Direita</option>
              <option value="Amarelo" class="op-amarelo">Amarelo</option>
              <option value="Azul" class="op-azul">Azul</option>
              <option value="Roxo" class="op-roxo">Roxo</option>
              <option value="Rosa" class="op-rosa">Rosa</option>
            </select>
          </div>
          <div class="linha-controle-pontos" id="ctrl-pts-direita">0</div>
          <div class="linha-controle-botoes">
            <button class="btn-acao-mais" onclick="adicionarPonto('direita')">+1</button>
            <button class="btn-acao-menos" onclick="subtrairPonto('direita')">-1</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- PLACAR PRINCIPAL -->
  <div class="container-placar-global">
    
    <main class="estrutura-placar" id="placar-main">
      
      <!-- Pop-up de Aviso Piscando -->
      <div class="overlay-fase" id="overlayFase">
        <div class="texto-piscando" id="textoOverlay">
          <span class="linha-fase">SEMI</span>
          <span class="linha-fase">FINAL</span>
        </div>
      </div>

      <div class="container-relogio-isolado">
        <div class="relogio-brasilia" id="relogio">00:00:00</div>
      </div>

      <div class="container-centro-elementos">
        <button class="btn-inverter-lados" onclick="inverterLados()" title="Inverter Cores">⇄</button>
        <img src="https://i.ibb.co/8LqSRDLB/logo-sem-fundo.png" alt="Logo Bola Fora" class="logo-central">
        <button class="btn-zerar-central" onclick="zerarPlacar()" title="Zerar Placar">🔄</button>
      </div>

      <div class="container-apito-isolado">
        <button class="btn-apito" 
                onpointerdown="iniciarApito(event)" 
                onpointerup="pararApito(event)" 
                onpointerleave="pararApito(event)"
                oncontextmenu="event.preventDefault()" 
                title="Segure para Apitar">📢</button>
      </div>
      
      <!-- LADO ESQUERDO -->
      <div class="lado-placar">
        <div class="faixa-base-time" id="faixa-esquerda"></div>
        <span class="bola-volei-indicador" id="bola-esquerda">🏐</span>
        <select class="seletor-cor-time" id="cor-esquerda" onclick="event.stopPropagation()" onchange="mudarCor('esquerda')">
          <option value="" class="op-padrao">Cor</option>
          <option value="Amarelo" class="op-amarelo">Amarelo</option>
          <option value="Azul" class="op-azul">Azul</option>
          <option value="Roxo" class="op-roxo">Roxo</option>
          <option value="Rosa" class="op-rosa">Rosa</option>
        </select>
        <div class="area-ponto" onclick="adicionarPonto('esquerda', event)">
          <div class="numero-pontos" id="pts-esquerda">0</div>
        </div>
        <div class="controles-lado">
          <button class="btn-menos-um" onclick="subtrairPonto('esquerda')">-1</button>
        </div>
      </div>

      <!-- LADO DIREITO -->
      <div class="lado-placar">
        <div class="faixa-base-time" id="faixa-direita"></div>
        <span class="bola-volei-indicador" id="bola-direita">🏐</span>
        <select class="seletor-cor-time" id="cor-direita" onclick="event.stopPropagation()" onchange="mudarCor('direita')">
          <option value="" class="op-padrao">Cor</option>
          <option value="Amarelo" class="op-amarelo">Amarelo</option>
          <option value="Azul" class="op-azul">Azul</option>
          <option value="Roxo" class="op-roxo">Roxo</option>
          <option value="Rosa" class="op-rosa">Rosa</option>
        </select>
        <div class="area-ponto" onclick="adicionarPonto('direita', event)">
          <div class="numero-pontos" id="pts-direita">0</div>
        </div>
        <div class="controles-lado">
          <button class="btn-menos-um" onclick="subtrairPonto('direita')">-1</button>
        </div>
      </div>

    </main>

  </div>

  <!-- BARRA DE CONTROLES UNIFICADA -->
  <div class="barra-controles-unificada">
    <a href="dashboard.html" class="btn-topo-discreto">Central do Adm</a>
    <button type="button" class="btn-topo-discreto" onclick="toggleTabela()">Abrir Tabela</button>
    <button class="btn-topo-discreto btn-fixar-notif" id="btnModoControle" onclick="alternarModoControle()">Modo Controle</button>
    <button class="btn-topo-discreto" onclick="alternarTelaCheia()" id="btnFullscreen">Tela Cheia</button>
    <button class="btn-fase" id="btn-semi" onclick="alternarFase('semi')">🔊 Semifinal</button>
    <button class="btn-fase" id="btn-finais" onclick="alternarFase('finais')">🔊 Final</button>
    <select class="seletor-tema-placar" id="seletorTema" onchange="alterarTemaManual()">
      <option value="padrao">Padrão</option>
      <option value="semifinal">Prata</option>
      <option value="final">Dourado</option>
    </select>
  </div>

  <div class="container-placar-global" style="padding-top: 0;">
    <div class="janela-tabela" id="container-tabela">
      <div class="janela-tabela-barra">
        <span class="janela-tabela-titulo">📋 Tabela Bola Fora</span>
        <div class="janela-tabela-botoes">
          <button class="btn-janela" onclick="minimizarTabela()" title="Minimizar">➖</button>
          <button class="btn-janela" onclick="fecharTabela()" title="Fechar">❌</button>
        </div>
      </div>
      <iframe src="https://bolaforavb.github.io/centraldoadm/tabela_bola_fora.html" class="janela-tabela-conteudo" id="iframe-tabela"></iframe>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDj8QWo0f_n5Tn56ka7UzIGSUo9OmpGv9U",
      databaseURL: "https://central-adm-bolafora-default-rtdb.firebaseio.com/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const placarRef = db.ref('placar_digital');

    let placarLocal = {
      esquerda: 0,
      direita: 0,
      corEsquerda: "",
      corDireita: "",
      fase: null,
      tema: "padrao",
      ultimoPontuador: null
    };

    let ultimaFaseProcessada = null;

    const estilosCores = {
      "Amarelo": { bg: "#ffeb3b", text: "#000" },
      "Azul": { bg: "#2196f3", text: "#fff" },
      "Roxo": { bg: "#9c27b0", text: "#fff" },
      "Rosa": { bg: "#e91e63", text: "#fff" },
      "": { bg: "#f7f5f2", text: "#12364e" }
    };

    let audioContext;
    let audioBufferApito;
    let audioBufferSemi;
    let audioBufferFinal;
    let audioSource = null;
    let estaTocando = false;

    fetch('https://bolaforavb.github.io/centraldoadm/apito.wav')
      .then(res => res.arrayBuffer())
      .then(buf => (audioContext || (audioContext = new (window.AudioContext || window.webkitAudioContext)())).decodeAudioData(buf))
      .then(decoded => { audioBufferApito = decoded; })
      .catch(err => console.error("Erro ao carregar apito.wav:", err));

    fetch('https://bolaforavb.github.io/centraldoadm/anuncio_semifinais.wav')
      .then(res => res.arrayBuffer())
      .then(buf => (audioContext || (audioContext = new (window.AudioContext || window.webkitAudioContext)())).decodeAudioData(buf))
      .then(decoded => { audioBufferSemi = decoded; })
      .catch(err => console.error("Erro ao carregar anuncio_semifinais.wav:", err));

    fetch('https://bolaforavb.github.io/centraldoadm/anuncio_finais.wav')
      .then(res => res.arrayBuffer())
      .then(buf => (audioContext || (audioContext = new (window.AudioContext || window.webkitAudioContext)())).decodeAudioData(buf))
      .then(decoded => { audioBufferFinal = decoded; })
      .catch(err => console.error("Erro ao carregar anuncio_finais.wav:", err));

    function tocarAudioUnico(buffer) {
      if (!buffer) return;
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start(0);
      } catch (e) {
        console.error("Erro ao reproduzir áudio único:", e);
      }
    }

    function iniciarApito(event) {
      if (event) event.preventDefault();
      if (!audioBufferApito || estaTocando) return;

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      estaTocando = true;
      audioSource = audioContext.createBufferSource();
      audioSource.buffer = audioBufferApito;
      audioSource.loop = true;
      audioSource.loopStart = 0.15; 
      audioSource.loopEnd = audioBufferApito.duration - 0.40; 
      audioSource.connect(audioContext.destination);
      audioSource.start(0);
    }

    function pararApito(event) {
      if (event) event.preventDefault();
      estaTocando = false;
      if (audioSource) {
        try { audioSource.stop(); } catch(e) {}
        audioSource = null;
      }
    }

    function tocarBipPonto() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }

        const oscilador = audioContext.createOscillator();
        const ganho = audioContext.createGain();

        oscilador.type = 'sine';
        oscilador.frequency.setValueAtTime(800, audioContext.currentTime);

        ganho.gain.setValueAtTime(0.15, audioContext.currentTime);
        ganho.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.08);

        oscilador.connect(ganho);
        ganho.connect(audioContext.destination);

        oscilador.start();
        oscilador.stop(audioContext.currentTime + 0.08);
      } catch (e) {
        console.error("Erro ao reproduzir bip:", e);
      }
    }

    let diferencaTempoServidor = 0;

    function sincronizarRelogio() {
      fetch('https://worldtimeapi.org/api/timezone/America/Sao_Paulo')
        .then(res => res.json())
        .then(data => {
          const horaServidor = new Date(data.datetime).getTime();
          const horaLocal = Date.now();
          diferencaTempoServidor = horaServidor - horaLocal;
        })
        .catch(err => console.error("Erro ao sincronizar com o horário de Brasília:", err));
    }

    function atualizarRelogioVisual() {
      const agoraCorrigido = new Date(Date.now() + diferencaTempoServidor);
      const horas = String(agoraCorrigido.getHours()).padStart(2, '0');
      const minutes = String(agoraCorrigido.getMinutes()).padStart(2, '0');
      const segundos = String(agoraCorrigido.getSeconds()).padStart(2, '0'); 
      
      const elementoRelogio = document.getElementById('relogio');
      if (elementoRelogio) {
        elementoRelogio.innerText = `${horas}:${minutes}:${segundos}`;
      }
    }

    sincronizarRelogio();
    setInterval(atualizarRelogioVisual, 100); 
    setInterval(sincronizarRelogio, 600000); 

    function toggleTabela() {
      const container = document.getElementById('container-tabela');
      const iframe = document.getElementById('iframe-tabela');
      
      if (container.style.display === 'none' || container.style.display === '') {
        container.style.display = 'block';
        iframe.classList.remove('minimizado');
        setTimeout(() => { container.scrollIntoView({ behavior: 'smooth' }); }, 100);
      } else if (iframe.classList.contains('minimizado')) {
        iframe.classList.remove('minimizado');
      } else {
        iframe.classList.add('minimizado');
      }
    }

    function minimizarTabela() {
      const iframe = document.getElementById('iframe-tabela');
      iframe.classList.toggle('minimizado');
    }

    function fecharTabela() {
      const container = document.getElementById('container-tabela');
      container.style.display = 'none';
    }

    function atualizarAparenciaSeletor(lado, cor) {
      const select = document.getElementById(`cor-${lado}`);
      const selectCtrl = document.getElementById(`ctrl-cor-${lado}`);
      const estilo = estilosCores[cor] || estilosCores[""];
      
      if (select) {
        select.style.backgroundColor = estilo.bg;
        select.style.color = estilo.text;
      }
      if (selectCtrl) {
        selectCtrl.style.backgroundColor = estilo.bg;
        selectCtrl.style.color = estilo.text;
      }

      const ladoContainer = select ? select.closest('.lado-placar') : null;
      if (ladoContainer) {
        const btnMenos = ladoContainer.querySelector('.btn-menos-um');
        if (btnMenos) {
          btnMenos.style.backgroundColor = estilo.bg;
          btnMenos.style.color = estilo.text;
          btnMenos.style.borderColor = cor ? estilo.bg : "#12364e";
        }

        const faixaEsq = document.getElementById('faixa-esquerda');
        const faixaDir = document.getElementById('faixa-direita');

        if (faixaEsq && lado === 'esquerda') {
          faixaEsq.style.backgroundColor = cor ? estilo.bg : "transparent";
        }
        if (faixaDir && lado === 'direita') {
          faixaDir.style.backgroundColor = cor ? estilo.bg : "transparent";
        }
      }
    }

    function atualizarOpcoesDisponiveis() {
      const valEsq = placarLocal.corEsquerda || "";
      const valDir = placarLocal.corDireita || "";

      [document.getElementById('cor-esquerda'), document.getElementById('ctrl-cor-esquerda')].forEach(sel => {
        if (!sel) return;
        for (let option of sel.options) {
          if (option.value === "") {
            option.style.display = "block";
          } else {
            option.style.display = (option.value === valDir) ? "none" : "block";
          }
        }
      });

      [document.getElementById('cor-direita'), document.getElementById('ctrl-cor-direita')].forEach(sel => {
        if (!sel) return;
        for (let option of sel.options) {
          if (option.value === "") {
            option.style.display = "block";
          } else {
            option.style.display = (option.value === valEsq) ? "none" : "block";
          }
        }
      });
    }

    function aplicarTemaVisual(nomeTema) {
      const placarMain = document.getElementById('placar-main');
      const seletorTema = document.getElementById('seletorTema');

      if (placarMain) {
        placarMain.classList.remove('tema-padrao', 'tema-semifinal', 'tema-final');
        placarMain.classList.add(`tema-${nomeTema || 'padrao'}`);
      }

      if (seletorTema) {
        seletorTema.value = nomeTema || 'padrao';
      }
    }

    function alterarTemaManual() {
      const seletorTema = document.getElementById('seletorTema');
      if (seletorTema) {
        placarLocal.tema = seletorTema.value;
        placarRef.set(placarLocal);
      }
    }

    function atualizarVisualFase(fase) {
      const btnSemi = document.getElementById('btn-semi');
      const btnFinais = document.getElementById('btn-finais');
      const overlay = document.getElementById('overlayFase');
      const textoOverlay = document.getElementById('textoOverlay');

      if (btnSemi && btnFinais) {
        if (fase === 'semi') {
          btnSemi.classList.add('ativo');
          btnFinais.classList.remove('ativo');
          if (textoOverlay) textoOverlay.innerHTML = '<span class="linha-fase">SEMI</span><span class="linha-fase">FINAL</span>';
          if (overlay) overlay.style.display = 'flex';

          if (ultimaFaseProcessada !== 'semi') {
            tocarAudioUnico(audioBufferSemi);
          }
        } else if (fase === 'finais') {
          btnFinais.classList.add('ativo');
          btnSemi.classList.remove('ativo');
          if (textoOverlay) textoOverlay.innerHTML = '<span class="linha-fase">FINAL</span>';
          if (overlay) overlay.style.display = 'flex';

          if (ultimaFaseProcessada !== 'finais') {
            tocarAudioUnico(audioBufferFinal);
          }
        } else {
          btnSemi.classList.remove('ativo');
          btnFinais.classList.remove('ativo');
          if (overlay) overlay.style.display = 'none';
        }
        ultimaFaseProcessada = fase;
      }
    }

    placarRef.on('value', (snapshot) => {
      const dadosNuvem = snapshot.val();
      if (dadosNuvem) {
        placarLocal = dadosNuvem;
        
        const elemEsq = document.getElementById('pts-esquerda');
        const elemDir = document.getElementById('pts-direita');
        const ctrlElemEsq = document.getElementById('ctrl-pts-esquerda');
        const ctrlElemDir = document.getElementById('ctrl-pts-direita');
        
        const selEsq = document.getElementById('cor-esquerda');
        const selDir = document.getElementById('cor-direita');
        const ctrlSelEsq = document.getElementById('ctrl-cor-esquerda');
        const ctrlSelDir = document.getElementById('ctrl-cor-direita');

        const bolaEsq = document.getElementById('bola-esquerda');
        const bolaDir = document.getElementById('bola-direita');

        if(elemEsq) elemEsq.innerText = placarLocal.esquerda || 0;
        if(elemDir) elemDir.innerText = placarLocal.direita || 0;
        if(ctrlElemEsq) ctrlElemEsq.innerText = placarLocal.esquerda || 0;
        if(ctrlElemDir) ctrlElemDir.innerText = placarLocal.direita || 0;

        if(selEsq) selEsq.value = placarLocal.corEsquerda || "";
        if(selDir) selDir.value = placarLocal.corDireita || "";
        if(ctrlSelEsq) ctrlSelEsq.value = placarLocal.corEsquerda || "";
        if(ctrlSelDir) ctrlSelDir.value = placarLocal.corDireita || "";

        if (bolaEsq && bolaDir) {
          if (placarLocal.ultimoPontuador === 'esquerda') {
            bolaEsq.classList.add('ativo');
            bolaDir.classList.remove('ativo');
          } else if (placarLocal.ultimoPontuador === 'direita') {
            bolaDir.classList.add('ativo');
            bolaEsq.classList.remove('ativo');
          } else {
            bolaEsq.classList.remove('ativo');
            bolaDir.classList.remove('ativo');
          }
        }

        atualizarAparenciaSeletor('esquerda', placarLocal.corEsquerda || "");
        atualizarAparenciaSeletor('direita', placarLocal.corDireita || "");
        atualizarOpcoesDisponiveis();
        atualizarVisualFase(placarLocal.fase || null);
        aplicarTemaVisual(placarLocal.tema || 'padrao');
      } else {
        const estadoInicial = { esquerda: 0, direita: 0, corEsquerda: "", corDireita: "", fase: null, tema: "padrao", ultimoPontuador: null };
        placarRef.set(estadoInicial);
      }
    });

    function adicionarPonto(lado, event) {
      if (event && event.target.tagName === 'SELECT') return;
      
      if ("vibrate" in navigator) {
        navigator.vibrate(50);
      }

      tocarBipPonto();

      placarLocal[lado] = (placarLocal[lado] || 0) + 1;
      placarLocal.ultimoPontuador = lado;
      placarRef.set(placarLocal);
    }

    function subtrairPonto(lado) {
      if ("vibrate" in navigator) {
        navigator.vibrate(30);
      }

      if (placarLocal[lado] > 0) {
        placarLocal[lado] -= 1;
        placarRef.set(placarLocal);
      }
    }

    function mudarCor(lado) {
      placarLocal.corEsquerda = document.getElementById('cor-esquerda').value;
      placarLocal.corDireita = document.getElementById('cor-direita').value;
      placarRef.set(placarLocal);
    }

    function mudarCorLocal(lado) {
      placarLocal.corEsquerda = document.getElementById('ctrl-cor-esquerda').value;
      placarLocal.corDireita = document.getElementById('ctrl-cor-direita').value;
      placarRef.set(placarLocal);
    }

    function inverterLados() {
      const corEsquerdaTemp = placarLocal.corEsquerda;
      
      placarLocal.corEsquerda = placarLocal.corDireita;
      placarLocal.corDireita = corEsquerdaTemp;

      if (placarLocal.ultimoPontuador === 'esquerda') {
        placarLocal.ultimoPontuador = 'direita';
      } else if (placarLocal.ultimoPontuador === 'direita') {
        placarLocal.ultimoPontuador = 'esquerda';
      }

      placarRef.set(placarLocal);
    }

    function zerarPlacar() {
      if (confirm("Deseja reiniciar a contagem do placar para 0 x 0?")) {
        placarRef.set({ esquerda: 0, direita: 0, corEsquerda: "", corDireita: "", fase: null, tema: "padrao", ultimoPontuador: null });
      }
    }

    function alternarFase(tipo) {
      if (placarLocal.fase === tipo) {
        placarLocal.fase = null;
      } else {
        placarLocal.fase = tipo;
        placarLocal.tema = (tipo === 'semi') ? 'semifinal' : 'final';
      }
      placarRef.set(placarLocal);
    }

    function alternarModoControle() {
      const ativo = document.body.classList.toggle('modo-controle-ativo');
      const btnModo = document.getElementById('btnModoControle');
      if (ativo) {
        btnModo.innerText = "Voltar ao Padrão";
      } else {
        btnModo.innerText = "Modo Controle";
      }
    }

    function alternarTelaCheia() {
      const botao = document.getElementById('btnFullscreen');
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        const elemento = document.documentElement;
        if (elemento.requestFullscreen) { elemento.requestFullscreen(); } 
        else if (elemento.webkitRequestFullscreen) { elemento.webkitRequestFullscreen(); } 
        else if (elemento.msRequestFullscreen) { elemento.msRequestFullscreen(); }
        if (botao) botao.innerText = "Tela Cheia";
      } else {
        if (document.exitFullscreen) { document.exitFullscreen(); } 
        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); } 
        else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        if (botao) botao.innerText = "Tela Cheia";
      }
    }

    function monitorarMudancaTelaCheia() {
      const botao = document.getElementById('btnFullscreen');
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (botao) botao.innerText = "🔲 Tela Cheia";
      }
    }

    document.addEventListener('fullscreenchange', monitorarMudancaTelaCheia);
    document.addEventListener('webkitfullscreenchange', monitorarMudancaTelaCheia);
    document.addEventListener('msfullscreenchange', monitorarMudancaTelaCheia);
  </script>
